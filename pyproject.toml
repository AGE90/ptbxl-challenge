[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptbxl"
version = "0.1.0"
description = "A short description of the project."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "No license file"}
authors = [
    {name = "AGE90", email = "alejandrogomezechavarria@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: No license file",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyprojroot",
    "numpy",
    "pandas",
    "scipy",
    "wfdb",
    "pywavelets",
    "mlflow",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tqdm",
    "missingno",
    "openpyxl",
    "ipykernel",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "mypy",
    "ruff",
    "black",
]

[project.urls]
Homepage = "https://example.com"
"Bug Tracker" = "https://example.com/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
addopts = "--cov=src"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Match flake8's old scope (pyflakes + pycodestyle) rather than ruff's much
# broader default rule set, so this is a straight tool swap, not a repo-wide
# style overhaul.
select = ["E", "F", "W"]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true