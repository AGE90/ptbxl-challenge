data:
  sampling_rate: 100
  trim_seconds: 1.0

preprocessing:
  lowcut: 5.0
  highcut: 12.0
  filter_order: 4
  window_ms: 150

features:
  spectral: true
  temporal: true
  wavelet: true

selection:
  method: consensus
  max_features: 10
  sample_size: null
  # Options: anova_f, mutual_info, select_from_model, rfe, relief, relieff,
  # multisurf, extra_trees, pso (needs the `metaheuristics` extra).
  # Relief-family is O(n^2): slow without a sample_size.
  methods: [anova_f, mutual_info, select_from_model, rfe]

training:
  model: xgboost
  random_state: 42

optimization:
  n_trials: 50
  metric: roc_auc
